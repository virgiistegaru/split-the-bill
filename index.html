<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split the Bill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Split the Bill</h1>
    <p>Easily split your bill with your friends</p>

    <form id="billForm">
        <label for="billAmount">Bill Amount:</label>
        <input type="number" id="billAmount" min="1" placeholder="Bill Amount">
        <label for="numPeople">Number of People:</label>
        <input type="number" id="numPeople" min="1" placeholder="Number of People">
        <label for="tipPercentage">Tip Percentage:</label>
        <input type="number" id="tipPercentage" min="0" placeholder="Tip">
        <button type="submit">Calculate</button>
    </form>
    
    <h2>Results:</h2>
    <p id="tipAmount">Tip Amount: 0</p>
    <p id="totalAmount">Total Amount: 0</p>
    <p id="amountPerPerson">Amount Per Person: 0</p>

    <script src="script.js"></script>
    </div>
</body>
</html>
